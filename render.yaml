services:
  - type: web
    name: ga5-a2a-invoice-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TEST_MODE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./a2a_invoice_agent.db
      - key: AUTH_BEARER_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
